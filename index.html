<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
</head>
<body>
<title>聲浪引擎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: instrument-cluster left (the gauge is the product), controls stacked right; single column on phones.
   Deliberately single-theme: a night-cluster look with amber backlight, like the dial it imitates. */
:root {
  --bg: #111214;
  --panel: #191a1d;
  --rim: #2a2c30;
  --ink: #ece8df;
  --mute: #8d8f94;
  --amber: #ffad1f;
  --red: #ff4433;
  --good: #57c98a;
  --f-num: 'Saira Semi Condensed', 'Noto Sans TC', system-ui, sans-serif;
  --f-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 12px 28px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 1280px; margin: 0 auto 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font-family: var(--f-body); font-weight: 700; font-size: 26px; letter-spacing: 0.08em; }
.brand span { color: var(--mute); font-size: 13px; }
.pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rim); color: var(--mute); display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--rim); }
.pill[data-state="good"] { color: var(--ink); } .pill[data-state="good"]::before { background: var(--good); }
.pill[data-state="warn"]::before { background: var(--amber); }
.pill[data-state="bad"] { color: var(--red); } .pill[data-state="bad"]::before { background: var(--red); }

.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; max-width: 1280px; margin: 0 auto; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.cluster { background: var(--panel); border: 1px solid var(--rim); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#tach { width: 100%; aspect-ratio: 1.25 / 1; max-width: 100%; display: block; }
.readout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.read { display: flex; flex-direction: column; gap: 2px; }
.read b { font-family: var(--f-num); font-weight: 600; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.read small { color: var(--mute); font-size: 12px; letter-spacing: 0.06em; }
.loadwrap { height: 6px; background: var(--rim); border-radius: 3px; overflow: hidden; margin-top: 10px; }
#loadBar { height: 100%; background: var(--amber); transform-origin: left; transform: scaleX(0); transition: transform 80ms linear; }

.pads { display: flex; gap: 10px; flex-wrap: wrap; }
.pad { flex: 1 1 120px; min-height: 64px; border-radius: 12px; border: 1px solid var(--rim); background: var(--bg); font-size: 17px; font-weight: 700; letter-spacing: 0.1em; touch-action: none; user-select: none; -webkit-user-select: none; }
.pad.down { background: var(--rim); }
#gas { border-color: var(--amber); color: var(--amber); }
#gas.down { background: var(--amber); color: var(--bg); }
#brake.down { border-color: var(--red); color: var(--red); }
.pad.small { flex: 1 1 90px; min-height: 52px; font-size: 15px; }

.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
#start { min-height: 72px; border-radius: 999px; border: 2px solid var(--red); background: transparent; color: var(--ink); font-size: 20px; font-weight: 700; letter-spacing: 0.2em; }
#start.on { background: var(--red); color: #fff; }
.group { display: flex; flex-direction: column; gap: 8px; }
.label { color: var(--mute); font-size: 12px; letter-spacing: 0.12em; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rim); border-radius: 10px; overflow: hidden; }
.seg button { padding: 10px 8px; background: transparent; border: 0; border-right: 1px solid var(--rim); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--rim); color: var(--amber); font-weight: 700; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 420px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--rim); background: var(--panel); }
input[type=range] { width: 100%; accent-color: var(--amber); }

#engines { display: flex; flex-direction: column; gap: 8px; }
.eng { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rim); background: var(--panel); display: grid; gap: 2px; }
.eng[aria-pressed="true"] { border-color: var(--amber); }
.eng-name { font-weight: 700; font-size: 16px; }
.eng[aria-pressed="true"] .eng-name { color: var(--amber); }
.eng-meta { font-family: var(--f-num); font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.eng-note { font-size: 13px; color: var(--mute); }

.note { font-size: 13px; color: var(--mute); border-top: 1px solid var(--rim); padding-top: 12px; margin: 0; }
.note b { color: var(--ink); font-weight: 500; }
.help { font-size: 13px; border: 1px solid var(--red); border-radius: 10px; padding: 10px 12px; margin: 0; }
kbd { font-family: var(--f-num); border: 1px solid var(--rim); border-radius: 4px; padding: 0 5px; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { #loadBar { transition: none; } }
</style>

<header class="top">
  <div class="brand"><h1>聲浪</h1><span>給電動車的引擎聲</span></div>
  <span class="pill" id="gps" data-state="">GPS 未使用</span>
</header>

<main class="grid">
  <section class="cluster" aria-label="儀表">
    <canvas id="tach" aria-label="轉速表"></canvas>
    <div>
      <div class="readout">
        <div class="read"><b id="spd">0</b><small>KM/H</small></div>
        <div class="read"><b id="rpmNum">0</b><small>RPM</small></div>
        <div class="read"><b id="loadTxt" style="font-size:22px;line-height:1.55">熄火</b><small>引擎狀態</small></div>
      </div>
      <div class="loadwrap" aria-hidden="true"><div id="loadBar"></div></div>
    </div>
    <div class="pads" id="simPad">
      <button class="pad" id="brake" type="button">煞車</button>
      <button class="pad" id="gas" type="button">油門</button>
    </div>
    <div class="pads" id="manPad">
      <button class="pad small" id="downBtn" type="button">− 降檔</button>
      <button class="pad small" id="blip" type="button">補油</button>
      <button class="pad small" id="upBtn" type="button">升檔 +</button>
    </div>
  </section>

  <aside class="side">
    <button id="start" type="button">發動引擎</button>

    <div class="row2">
      <div class="group">
        <span class="label">速度來源</span>
        <div class="seg" role="group" aria-label="速度來源">
          <button type="button" data-mode="sim">模擬</button>
          <button type="button" data-mode="gps">GPS</button>
        </div>
      </div>
      <div class="group">
        <span class="label">變速箱</span>
        <div class="seg" role="group" aria-label="變速箱">
          <button type="button" data-trans="auto">自排</button>
          <button type="button" data-trans="manual">手排</button>
        </div>
      </div>
    </div>

    <p class="help" id="gpsHelp" hidden>這個畫面讀不到位置。GPS 模式要在你自己的 HTTPS 網址上開啟，並允許瀏覽器使用位置。在這之前可以先用「模擬」試聽。</p>

    <div class="row2">
      <label class="group"><span class="label">你的車</span>
        <select id="car">
          <option value="rwd">後驅標準版</option>
          <option value="lr">長程雙馬達</option>
          <option value="perf">Performance</option>
        </select>
      </label>
      <label class="group"><span class="label">音量</span>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7">
      </label>
    </div>

    <div class="group">
      <span class="label">引擎</span>
      <div id="engines"></div>
    </div>

    <p class="note"><b>模擬模式</b>按住油門加速、放開就收油回火。鍵盤：<kbd>↑</kbd> 油門 <kbd>↓</kbd> 煞車 <kbd>空白</kbd> 補油 <kbd>←</kbd><kbd>→</kbd> 換檔。<br><b>在車上</b>用 GPS 模式，方向盤的上一首／下一首可以換檔，按一下是補油。</p>
  </aside>
</main>

<script>
class EngineDSP {
  constructor(sr) {
    this.sr = sr;
    this.phase = 0; this.rpm = 0; this.tRpm = 0; this.load = 0; this.tLoad = 0;
    this.on = false; this.cut = false; this.starter = false;
    this.kR = 1 - Math.exp(-1 / (sr * 0.025));
    this.kL = 1 - Math.exp(-1 / (sr * 0.04));
    this.kBu = 1 - Math.exp(-1 / (sr * 0.55));
    this.kBd = 1 - Math.exp(-1 / (sr * 0.25));
    this.kBov = Math.exp(-1 / (sr * 0.3));
    this.P = 48;
    this.pT = new Float32Array(this.P); this.pLen = new Float32Array(this.P);
    this.pAmp = new Float32Array(this.P); this.pNz = new Float32Array(this.P);
    this.pBank = new Uint8Array(this.P); this.pAct = new Uint8Array(this.P);
    this.boost = 0; this.bov = 0; this.peakLoad = 0; this.wPh = 0; this.stPh = 0;
    this.h1 = 0; this.h2 = 0;
    this.lpL = 0; this.lpL2 = 0; this.lpR = 0; this.lpR2 = 0;
    this.dxL = 0; this.dyL = 0; this.dxR = 0; this.dyR = 0;
    this.seed = 22222; this.eng = null; this.preGain = 1; this.ovT = 0;
  }
  rand() {
    let x = this.seed | 0; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; this.seed = x;
    return (x >>> 0) / 4294967296;
  }
  bp(f, q) {
    const w = 2 * Math.PI * Math.min(f, this.sr * 0.45) / this.sr, al = Math.sin(w) / (2 * q), a0 = 1 + al;
    return { b0: al / a0, b2: -al / a0, a1: -2 * Math.cos(w) / a0, a2: (1 - al) / a0, z1: 0, z2: 0 };
  }
  run(f, x) {
    const y = f.b0 * x + f.z1;
    f.z1 = -f.a1 * y + f.z2;
    f.z2 = f.b2 * x - f.a2 * y;
    return y;
  }
  setEngine(e) {
    this.eng = e;
    this.n = e.offsets.length;
    this.off = e.offsets.map(o => ((o % 1) + 1) % 1);
    this.nb = Math.max.apply(null, e.banks) + 1;
    const pipes = Array.isArray(e.pipeHz) ? e.pipeHz : [e.pipeHz, e.pipeHz * 1.07];
    this.res = []; this.dl = []; this.di = [];
    for (let b = 0; b < this.nb; b++) {
      this.res.push(e.res.map(r => Object.assign(this.bp(r[0] * (b ? 1.04 : 1), r[1]), { g: r[2] })));
      this.dl.push(new Float32Array(Math.max(8, Math.round(this.sr / pipes[b]))));
      this.di.push(0);
    }
    this.bovF = this.bp(2600, 1.3);
    this.pAct.fill(0);
    this.preGain = e.level || 1;
  }
  addPulse(b, amp, nz, len) {
    for (let k = 0; k < this.P; k++) {
      if (!this.pAct[k]) {
        this.pAct[k] = 1; this.pT[k] = 0; this.pLen[k] = Math.max(2, len);
        this.pAmp[k] = amp; this.pNz[k] = nz; this.pBank[k] = b; return;
      }
    }
  }
  fire(i, cps) {
    const e = this.eng, sr = this.sr, b = e.banks[i];
    const L = this.load, rN = Math.min(1.1, this.rpm / e.redline);
    if (this.cut && this.rand() < 0.7) {
      if (this.rand() < 0.2 * e.pops) this.addPulse(b, 1.5 + this.rand(), 2.4, 0.003 * sr);
      return;
    }
    let amp = (0.3 + 0.7 * Math.pow(L, 0.8)) * e.gains[i] * (0.92 + 0.16 * this.rand()) * (0.75 + 0.45 * rN);
    if (this.starter) amp *= this.rand() < 0.5 ? 0 : 0.35;
    const interval = sr / (cps * this.n);
    const len = Math.min(Math.max(e.pulse * interval, 0.0012 * sr), 0.012 * sr);
    const nz = e.noise * (L < 0.08 ? 2.2 : 1);
    this.addPulse(b, amp, nz, len);
    // Overrun crackle: a burst right after lifting off, thinning out as the exhaust cools.
    // Rate is in pops per second, converted to a chance per firing.
    const popRate = (3 + 12 * rN) * e.pops * (Math.exp(-this.ovT / 1.2) + 0.12);
    if (L < 0.08 && this.rpm > 2200 && !this.starter && this.rand() < popRate / (cps * this.n)) {
      this.addPulse(b, 1.1 + 0.9 * this.rand(), 2.5, 0.0025 * sr + this.rand() * 0.004 * sr);
    }
  }
  process(outL, outR, N) {
    const e = this.eng;
    if (!e) { outL.fill(0); if (outR !== outL) outR.fill(0); return; }
    const sr = this.sr, TAU = Math.PI * 2;
    for (let s = 0; s < N; s++) {
      this.rpm += (this.tRpm - this.rpm) * this.kR;
      this.load += (this.tLoad - this.load) * this.kL;
      const rN = Math.min(1.1, this.rpm / e.redline), L = this.load;
      this.ovT = L < 0.08 ? this.ovT + 1 / sr : 0;
      const cps = Math.max(0, this.rpm) / 120;
      const p0 = this.phase, p1 = p0 + cps / sr;
      if (this.on && cps > 0.5) {
        for (let i = 0; i < this.n; i++) {
          const o = this.off[i];
          if ((o > p0 && o <= p1) || (o + 1 > p0 && o + 1 <= p1)) this.fire(i, cps);
        }
      }
      this.phase = p1 >= 1 ? p1 - 1 : p1;

      let x0 = 0, x1 = 0;
      for (let k = 0; k < this.P; k++) {
        if (!this.pAct[k]) continue;
        const u = this.pT[k] / this.pLen[k];
        let v = Math.sin(Math.PI * u) * (1 - 0.45 * u) * this.pAmp[k];
        if (this.pNz[k] > 0) v += (this.rand() * 2 - 1) * this.pAmp[k] * this.pNz[k] * (1 - u) * 0.5;
        if (this.pBank[k]) x1 += v; else x0 += v;
        if (++this.pT[k] >= this.pLen[k]) this.pAct[k] = 0;
      }

      const y0 = this.bank(0, x0);
      const y1 = this.nb > 1 ? this.bank(1, x1) : 0;

      // intake hiss
      const wn = this.rand() * 2 - 1;
      this.h1 += 0.35 * (wn - this.h1);
      this.h2 += 0.03 * (this.h1 - this.h2);
      const hiss = (this.h1 - this.h2) * (this.on ? 0.012 + 0.05 * L * rN : 0);

      // turbo
      let tb = 0;
      if (e.turbo > 0) {
        const tgt = this.on && L > 0.3 ? L * Math.min(1, rN * 1.6) : 0;
        this.boost += (tgt - this.boost) * (tgt > this.boost ? this.kBu : this.kBd);
        if (L > 0.55) this.peakLoad = 1;
        if (this.peakLoad && L < 0.15) {
          if (this.boost > 0.35) this.bov = Math.max(this.bov, this.boost);
          this.peakLoad = 0;
        }
        this.wPh += TAU * (1800 + 5200 * this.boost) / sr;
        if (this.wPh > TAU) this.wPh -= TAU;
        tb = Math.sin(this.wPh) * this.boost * this.boost * 0.03 * e.turbo;
        if (this.bov > 0.001) {
          tb += this.run(this.bovF, wn) * this.bov * 0.5 * e.turbo;
          this.bov *= this.kBov;
        }
      }

      // starter motor whine
      let st = 0;
      if (this.starter) {
        this.stPh += TAU * (160 + this.rpm * 0.4) / sr;
        if (this.stPh > TAU) this.stPh -= TAU;
        st = (Math.sin(this.stPh) + 0.4 * Math.sin(this.stPh * 3)) * 0.05;
      }

      const drive = e.drive * (0.6 + 0.6 * L) * this.preGain;
      const sl = this.nb > 1 ? y0 * 0.68 + y1 * 0.32 : y0;
      const srr = this.nb > 1 ? y0 * 0.32 + y1 * 0.68 : y0;
      let l = Math.tanh(sl * drive) * 0.55 + hiss + tb + st;
      let r = Math.tanh(srr * drive) * 0.55 + hiss + tb + st;

      const fc = 700 + 7000 * e.bright * (0.3 + 0.7 * Math.min(1, rN)) * (0.6 + 0.4 * L);
      const a = 1 - Math.exp(-TAU * fc / sr);
      this.lpL += a * (l - this.lpL); this.lpL2 += a * (this.lpL - this.lpL2);
      this.lpR += a * (r - this.lpR); this.lpR2 += a * (this.lpR - this.lpR2);
      l = this.lpL2; r = this.lpR2;

      const oL = l - this.dxL + 0.995 * this.dyL; this.dxL = l; this.dyL = oL;
      const oR = r - this.dxR + 0.995 * this.dyR; this.dxR = r; this.dyR = oR;
      outL[s] = oL;
      if (outR !== outL) outR[s] = oR;
    }
  }
  bank(b, x) {
    const e = this.eng, rs = this.res[b];
    let y = x * e.direct;
    for (let j = 0; j < rs.length; j++) y += this.run(rs[j], x) * rs[j].g;
    const d = this.dl[b]; let i = this.di[b];
    const c = y + e.pipeFb * d[i];
    d[i] = c; i++; if (i >= d.length) i = 0; this.di[b] = i;
    return c;
  }
  msg(d) {
    if (d.engine) this.setEngine(d.engine);
    if ('rpm' in d) this.tRpm = d.rpm;
    if ('load' in d) this.tLoad = d.load;
    if ('on' in d) this.on = d.on;
    if ('cut' in d) this.cut = d.cut;
    if ('starter' in d) this.starter = d.starter;
  }
}

const ev = n => Array.from({ length: n }, (_, i) => i / n);
const ENGINES = [

      'process(i,o){const c=o[0];this.d.process(c[0],c[1]||c[0],c[0].length);return true}}\nregisterProcessor("engine-proc",P);';

function hav(a, b) {

  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;

  G.hasSpeed = !(z == null || isNaN(z) || z < 0);
  if (!G.hasSpeed) {
    // No speed field: derive it from two positions about 1 s apart. Windows do not overlap,
    // so each measurement carries independent error, and the filter trusts it less.
    const old = G.anchor;
    if (!old) { G.anchor = here; return; }
    const base = t - old.t;
    if (base < 0.9) return;
    G.anchor = here;
    if (base > 5) return; // too long a gap to say anything about speed
    z = hav(old, here) / base + (G.have ? G.a * base / 2 : 0);
    const pa = Math.max(2, Math.min(c.accuracy || 5, 20)) * 0.25;
    R = (pa * 1.414 / base) ** 2;
  } else {
    R = 0.35 * 0.35;
  }
  if (!G.have) {
    G.v = z; G.a = 0; G.P = [[R, 0], [0, 4]]; G.t = t; G.have = true;
  } else {
    const dt = Math.max(0.01, t - G.t), P = G.P;
    G.gap += 0.2 * (Math.min(dt, 2) - G.gap); // typical time between fixes
    // predict
    let v = G.v + G.a * dt, a = G.a;

    const q = JERK * Math.min(4, Math.max(1, G.gap / 0.1));

    let p10 = P[1][0] + dt * P[1][1] + q * dt * dt / 2;

    b.setAttribute('aria-pressed', String(e === S.eng));
    b.innerHTML = `<span class="eng-name"></span><span class="eng-meta"></span><span class="eng-note"></span>`;
    b.querySelector('.eng-name').textContent = e.name;
    b.querySelector('.eng-meta').textContent = `${e.power} · 紅線 ${e.redline.toLocaleString()} · ${e.box}`;
    b.querySelector('.eng-note').textContent = e.note;
    b.addEventListener('click', () => pickEngine(e));
    box.appendChild(b);
  });
}
function pickEngine(e) {
  S.eng = e;
  if (S.gear > e.gears.length - 1) S.gear = e.gears.length - 1;
  post({ engine: e });
  if (S.running) { S.startT = performance.now() / 1000 - 0.86; }
  try { navigator.mediaSession.metadata = new MediaMetadata({ title: e.name, artist: '聲浪引擎' }); } catch (_) {}
  document.querySelectorAll('.eng').forEach(b => b.setAttribute('aria-pressed', String(b.id === 'eng-' + e.id)));
  save();
}
function renderStart() {
  const b = $('#start');
  b.textContent = S.running ? '熄火' : '發動引擎';
  b.classList.toggle('on', S.running);
}
function renderSeg() {
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  document.querySelectorAll('[data-trans]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.trans === S.trans)));
  $('#simPad').hidden = S.mode !== 'sim';
  $('#upBtn').hidden = $('#downBtn').hidden = S.trans !== 'manual';
}
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  S.mode = b.dataset.mode;
  S.thrIn = 0; S.brk = 0;
  if (S.mode === 'gps') { if (S.running) startGps(); else setGps('off'); }
  else stopGps();
  renderSeg(); save();
}));
document.querySelectorAll('[data-trans]').forEach(b => b.addEventListener('click', () => {
  S.trans = b.dataset.trans; renderSeg(); save();
}));
$('#car').addEventListener('change', ev => { S.car = ev.target.value; save(); });
$('#vol').addEventListener('input', ev => {
  S.vol = +ev.target.value;
  if (master) master.gain.setTargetAtTime(S.vol, actx.currentTime, 0.05);
  save();
});
$('#start').addEventListener('click', toggleEngine);
function hold(el, on, off) {
  el.addEventListener('pointerdown', ev => { ev.preventDefault(); el.setPointerCapture?.(ev.pointerId); el.classList.add('down'); on(); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, () => { el.classList.remove('down'); off(); }));
}
hold($('#gas'), () => { S.thrIn = 1; }, () => { S.thrIn = 0; });
hold($('#brake'), () => { S.brk = 1; }, () => { S.brk = 0; });
hold($('#blip'), () => { S.blip = true; if (S.v > 0.5) S.blipUntil = performance.now() / 1000 + 0.25; }, () => { S.blip = false; });
$('#upBtn').addEventListener('click', () => shift(1, true));
$('#downBtn').addEventListener('click', () => shift(-1, true));
const keys = {};
addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('select,input')) return;
  if (keys[ev.code]) return; keys[ev.code] = true;
  if (ev.code === 'ArrowUp' || ev.code === 'KeyW') { if (S.mode === 'sim') S.thrIn = 1; ev.preventDefault(); }
  else if (ev.code === 'ArrowDown' || ev.code === 'KeyS') { S.brk = 1; ev.preventDefault(); }
  else if (ev.code === 'Space') { S.blip = true; ev.preventDefault(); }
  else if (ev.code === 'ArrowRight' || ev.code === 'KeyE') shift(1, true);
  else if (ev.code === 'ArrowLeft' || ev.code === 'KeyQ') shift(-1, true);
});
addEventListener('keyup', ev => {
  keys[ev.code] = false;
  if (ev.code === 'ArrowUp' || ev.code === 'KeyW') S.thrIn = 0;
  else if (ev.code === 'ArrowDown' || ev.code === 'KeyS') S.brk = 0;
  else if (ev.code === 'Space') S.blip = false;
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.running) { keepAwake(); if (actx) actx.resume(); }
});
function save() {
  try { localStorage.setItem('shenglang', JSON.stringify({ e: S.eng.id, m: S.mode, t: S.trans, c: S.car, v: S.vol })); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('shenglang') || 'null');
    if (!d) return;
    S.eng = ENGINES.find(x => x.id === d.e) || S.eng;
    if (d.m) S.mode = d.m;
    if (d.t) S.trans = d.t;
    if (CARS[d.c]) S.car = d.c;
    if (typeof d.v === 'number') S.vol = d.v;
  } catch (e) {}
}
load();
$('#car').value = S.car; $('#vol').value = S.vol;
renderEngines(); renderSeg(); renderStart(); setGps('off');

</script>
</body>
</html>
